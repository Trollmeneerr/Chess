<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Play chess online with friends or challenge AI bots. Puzzles, analysis, and more on Refrigerator Chess — isyourrefrigerator.online">
  <title>Refrigerator Chess — isyourrefrigerator.online</title>
  <link rel="icon" type="image/png" href="/images/logo.png">

  <!-- Typography: Space Grotesk, Inter, JetBrains Mono from isyourrefrigerator.online -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="/css/style.css">
  <link rel="stylesheet" href="/css/board.css">
  <link rel="stylesheet" href="/css/components.css">
</head>
<body>
  <!-- Ambient Scene & Aurora Background from isyourrefrigerator.online -->
  <div class="scene">
    <div class="aurora a1"></div>
    <div class="aurora a2"></div>
    <div class="aurora a3"></div>
    <div class="frost-grid"></div>
    <div class="grain"></div>
  </div>

  <div id="app">
    <!-- Sidebar Navigation -->
    <nav id="sidebar" class="sidebar">
      <div class="sidebar-logo">
        <a href="https://isyourrefrigerator.online" class="brand-link" target="_blank" rel="noopener noreferrer" title="Visit isyourrefrigerator.online">
          <img src="/images/logo.png" alt="Logo" class="logo-icon">
          <img src="/images/wordmark.png" alt="IsYourRefrigerator.online" class="logo-wordmark">
        </a>
        <div class="brand-subtag">
          <span class="badge"><span class="pulse-dot"></span> CHESS // ONLINE</span>
        </div>
      </div>

      <div class="sidebar-nav">
        <button class="nav-item active" data-page="lobby" id="nav-lobby">
          <svg width="20" height="20" viewBox="0 0 20 20" fill="currentColor"><path d="M10.707 2.293a1 1 0 00-1.414 0l-7 7a1 1 0 001.414 1.414L4 10.414V17a1 1 0 001 1h2a1 1 0 001-1v-2a1 1 0 011-1h2a1 1 0 011 1v2a1 1 0 001 1h2a1 1 0 001-1v-6.586l.293.293a1 1 0 001.414-1.414l-7-7z"/></svg>
          <span>Home</span>
        </button>
        <button class="nav-item" data-page="play" id="nav-play">
          <svg width="20" height="20" viewBox="0 0 20 20" fill="currentColor"><path fill-rule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zM9.555 7.168A1 1 0 008 8v4a1 1 0 001.555.832l3-2a1 1 0 000-1.664l-3-2z"/></svg>
          <span>Play</span>
        </button>
        <button class="nav-item" data-page="bots" id="nav-bots">
          <svg width="20" height="20" viewBox="0 0 20 20" fill="currentColor"><path d="M13 6a3 3 0 11-6 0 3 3 0 016 0zM18 8a2 2 0 11-4 0 2 2 0 014 0zM14 15a4 4 0 00-8 0v3h8v-3zM6 8a2 2 0 11-4 0 2 2 0 014 0zM16 18v-3a5.972 5.972 0 00-.75-2.906A3.005 3.005 0 0119 15v3h-3zM4.75 12.094A5.973 5.973 0 004 15v3H1v-3a3 3 0 013.75-2.906z"/></svg>
          <span>Bots</span>
        </button>
        <button class="nav-item" data-page="puzzles" id="nav-puzzles">
          <svg width="20" height="20" viewBox="0 0 20 20" fill="currentColor"><path d="M11 3a1 1 0 10-2 0v1a1 1 0 102 0V3zM15.657 5.757a1 1 0 00-1.414-1.414l-.707.707a1 1 0 001.414 1.414l.707-.707zM18 10a1 1 0 01-1 1h-1a1 1 0 110-2h1a1 1 0 011 1zM5.05 6.464A1 1 0 106.464 5.05l-.707-.707a1 1 0 00-1.414 1.414l.707.707zM4 11a1 1 0 100-2H3a1 1 0 000 2h1zM10 18a1 1 0 001-1v-1a1 1 0 10-2 0v1a1 1 0 001 1z"/><circle cx="10" cy="10" r="3"/></svg>
          <span>Puzzles</span>
        </button>
        <button class="nav-item" data-page="analysis" id="nav-analysis">
          <svg width="20" height="20" viewBox="0 0 20 20" fill="currentColor"><path fill-rule="evenodd" d="M3 3a1 1 0 000 2v8a2 2 0 002 2h2.586l-1.293 1.293a1 1 0 101.414 1.414L10 15.414l2.293 2.293a1 1 0 001.414-1.414L12.414 15H15a2 2 0 002-2V5a1 1 0 100-2H3zm11.707 4.707a1 1 0 00-1.414-1.414L10 9.586 8.707 8.293a1 1 0 00-1.414 0l-2 2a1 1 0 101.414 1.414L8 10.414l1.293 1.293a1 1 0 001.414 0l4-4z" clip-rule="evenodd"/></svg>
          <span>Review</span>
        </button>
        <button class="nav-item" data-page="leaderboard" id="nav-leaderboard">
          <svg width="20" height="20" viewBox="0 0 20 20" fill="currentColor"><path d="M5 3a2 2 0 00-2 2v2a2 2 0 002 2h2a2 2 0 002-2V5a2 2 0 00-2-2H5zM5 11a2 2 0 00-2 2v2a2 2 0 002 2h2a2 2 0 002-2v-2a2 2 0 00-2-2H5zM11 5a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2V5zM11 13a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2v-2z"/></svg>
          <span>Ranks</span>
        </button>
        <button class="nav-item" data-page="profile" id="nav-profile">
          <svg width="20" height="20" viewBox="0 0 20 20" fill="currentColor"><path fill-rule="evenodd" d="M10 9a3 3 0 100-6 3 3 0 000 6zm-7 9a7 7 0 1114 0H3z" clip-rule="evenodd"/></svg>
          <span>Profile</span>
        </button>
      </div>

      <!-- Quick External Links to Website and Panel -->
      <div class="sidebar-external-links">
        <a href="https://isyourrefrigerator.online" class="btn btn-outline btn-sm btn-block" target="_blank" rel="noopener noreferrer">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path><polyline points="9 22 9 12 15 12 15 22"></polyline></svg>
          <span>Main Site</span>
        </a>
        <a href="https://panel.isyourrefrigerator.online" class="btn btn-fill btn-sm btn-block mt-1" target="_blank" rel="noopener noreferrer">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="3" width="20" height="6" rx="1"></rect><rect x="2" y="15" width="20" height="6" rx="1"></rect><line x1="6" y1="6" x2="6.01" y2="6"></line><line x1="6" y1="18" x2="6.01" y2="18"></line></svg>
          <span>Server Panel</span>
        </a>
      </div>

      <div class="sidebar-bottom">
        <div id="user-panel" class="user-panel hidden">
          <div class="user-avatar" id="sidebar-avatar"></div>
          <div class="user-info">
            <span class="user-name" id="sidebar-username"></span>
            <span class="user-elo" id="sidebar-elo"></span>
          </div>
          <button class="btn-icon" id="btn-logout" title="Logout">
            <svg width="18" height="18" viewBox="0 0 20 20" fill="currentColor"><path fill-rule="evenodd" d="M3 3a1 1 0 00-1 1v12a1 1 0 102 0V4a1 1 0 00-1-1zm10.293 9.293a1 1 0 001.414 1.414l3-3a1 1 0 000-1.414l-3-3a1 1 0 10-1.414 1.414L14.586 9H7a1 1 0 100 2h7.586l-1.293 1.293z"/></svg>
          </button>
        </div>
        <div id="auth-panel" class="auth-panel">
          <button class="btn btn-fill btn-sm" id="btn-show-login">Sign In</button>
          <button class="btn btn-outline btn-sm" id="btn-show-register">Register</button>
        </div>
      </div>
    </nav>

    <!-- Main Content Area -->
    <main id="main-content" class="main-content">
      <!-- Pages are dynamically rendered here -->
    </main>
  </div>

  <!-- Bot Match Setup Modal (Popup for Challenging Bots) -->
  <div id="bot-match-modal" class="modal-overlay hidden">
    <div class="modal glass-panel bot-modal" style="max-width: 480px;">
      <button class="modal-close" id="bot-modal-close">&times;</button>
      <div id="bot-modal-content"></div>
    </div>
  </div>

  <!-- Auth Modal -->
  <div id="auth-modal" class="modal-overlay hidden">
    <div class="modal glass-panel">
      <button class="modal-close" id="auth-modal-close">&times;</button>
      <div id="auth-modal-content"></div>
    </div>
  </div>

  <!-- Promotion Modal -->
  <div id="promotion-modal" class="modal-overlay hidden">
    <div class="modal promotion-modal glass-panel">
      <h3>Promote Pawn</h3>
      <div class="promotion-pieces">
        <button class="promotion-piece" data-piece="q"></button>
        <button class="promotion-piece" data-piece="r"></button>
        <button class="promotion-piece" data-piece="b"></button>
        <button class="promotion-piece" data-piece="n"></button>
      </div>
    </div>
  </div>

  <!-- Forgot Password Modal -->
  <div id="forgot-modal" class="modal-overlay hidden">
    <div class="modal glass-panel" style="max-width: 420px;">
      <button class="modal-close" id="forgot-modal-close">&times;</button>
      <div class="modal-icon">🔒</div>
      <h2>Password Reset</h2>
      <p class="modal-text">Password resets are handled manually by the administrator. Please send a direct message to the admin on <strong>Discord</strong> with your username to receive a temporary reset token.</p>
      <button class="btn btn-fill" onclick="document.getElementById('forgot-modal').classList.add('hidden')">Understood</button>
    </div>
  </div>

  <!-- Game Replay Modal (Watch back saved matches) -->
  <div id="game-replay-modal" class="modal-overlay hidden">
    <div class="modal glass-panel" style="max-width: 820px;">
      <button class="modal-close" id="replay-modal-close">&times;</button>
      <div id="replay-modal-content"></div>
    </div>
  </div>

  <!-- Scripts -->
  <script src="/js/lib/chess.min.js"></script>
  <script src="/js/lib/socket.io.min.js"></script>
  <script src="/js/pieces.js"></script>
  <script src="/js/config.js"></script>
  <script src="/js/api.js"></script>
  <script src="/js/auth.js"></script>
  <script src="/js/board.js"></script>
  <script src="/js/pages/lobby.js"></script>
  <script src="/js/pages/play.js"></script>
  <script src="/js/pages/bots.js"></script>
  <script src="/js/pages/puzzles.js"></script>
  <script src="/js/pages/leaderboard.js"></script>
  <script src="/js/pages/analysis.js"></script>
  <script src="/js/pages/profile.js"></script>
  <script src="/js/app.js"></script>
</body>
</html>
